name: Codex PR review

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  check-target:
    if: >-
      (github.event.action != 'edited' || github.event.changes.base.ref.from) &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      eligible: ${{ steps.branch.outputs.eligible }}
    steps:
      - name: Compare the target branch case-sensitively
        id: branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ "$PR_BASE_REF" = "$DEFAULT_BRANCH" ]; then
            echo 'eligible=true' >> "$GITHUB_OUTPUT"
          fi

  review:
    needs: check-target
    if: needs.check-target.outputs.eligible == 'true'
    concurrency:
      group: codex-pr-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted base revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Install Codex CLI
        run: npm install --global @openai/codex@0.171.0
      - name: Review pull request
        env:
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ -z "$CODEX_API_KEY" ]; then
            echo "::error::Set the OPENAI_API_KEY Actions secret to run Codex."
            exit 1
          fi
          python3 plugins/invoke-skills/skills/codex-pr-review/scripts/review_pr.py \
            "$GITHUB_REPOSITORY" "$PR_NUMBER" --expected-head "$PR_HEAD" \
            --expected-base-ref "$PR_BASE_REF" --reviewer-login 'github-actions[bot]'
